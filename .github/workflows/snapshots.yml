name: snapshots

on:
  schedule:
    - cron: "0 01 * * *" # Daily at 01:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-publish
  cancel-in-progress: false

permissions:
  contents: write

env:
  GH_REPO: ${{ github.repository }}
  VERBOSE: "1"

jobs:
  activity-check:
    timeout-minutes: 10
    if: ${{ github.repository_owner == 'flamewing' }}
    runs-on: "ubuntu-latest"
    outputs:
      REPO_ALIVE: ${{ steps.activity.outputs.REPO_ALIVE }}
      build_id: ${{ steps.activity.outputs.build_id }}
      tag_name: ${{ steps.activity.outputs.tag_name }}
    steps:
      - name: Activity check
        id: activity
        shell: bash
        run: |
          DATEUTC=$(curl -sL https://api.github.com/repos/flamewing/asl-releases/commits | jq -r '[.[]][0]' | jq -r '.commit.committer.date')
          TIMESTAMP=$(date --utc -d "$DATEUTC" +%s)
          DAYS=$(( ($(date --utc +%s) - $TIMESTAMP) / 86400 ))
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            REPO_ALIVE=true
          else
            if [ $DAYS -gt 0 ]; then
              REPO_ALIVE=false
            else
              REPO_ALIVE=true
            fi
          fi
          build_id="v1.4.2.$(date --utc +'%Y%m%d')"
          tag_name="snapshot-${build_id}"
          {
            echo "REPO_ALIVE=${REPO_ALIVE}"
            echo "build_id=${build_id}"
            echo "tag_name=${tag_name}"
          } >> "$GITHUB_OUTPUT"
      - name: Create release
        if: ${{ steps.activity.outputs.REPO_ALIVE == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.activity.outputs.tag_name }}" \
            --draft \
            --target "${{ github.sha }}" \
            --title "Snapshot ${{ steps.activity.outputs.build_id }}" \
            --notes "Snapshot build for ${{ steps.activity.outputs.build_id }}.

          This is an automated snapshot build, not a stable release. For Apple Silicon binaries, please use the macOS ARM64 build."

  snapshots:
    timeout-minutes: 60
    needs:
      - activity-check
    if: ${{ github.repository_owner == 'flamewing' && needs.activity-check.outputs.REPO_ALIVE == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: linux32
            os: ubuntu-latest
            shell: bash
            package: asl-ubuntu-i686
            p7zip: 7z
            exe_ext: ""
            as: asl
            depends: "gcc-multilib"
            cflags: "-m32"
          - architecture: linux64
            os: ubuntu-latest
            shell: bash
            package: asl-ubuntu-x86_64
            p7zip: 7z
            exe_ext: ""
            as: asl
          - architecture: linux-aarch64
            os: ubuntu-24.04-arm
            shell: bash
            package: asl-ubuntu-aarch64
            p7zip: 7z
            exe_ext: ""
            as: asl
          - architecture: macos-x86_64
            os: macos-15-intel # last x86_64 runner image
            shell: bash
            package: asl-osx-x86_64
            p7zip: 7z
            exe_ext: ""
            as: asl
          - architecture: macos-arm64
            os: macos-latest # macos-latest is arm64.
            shell: bash
            package: asl-osx-arm64
            p7zip: 7z
            exe_ext: ""
            as: asl
          - architecture: win32
            os: windows-latest
            shell: msys2
            msystem: MINGW32
            package: asl-windows-i686
            p7zip: "/c/Program Files/7-Zip/7z.exe"
            exe_ext: ".exe"
            as: asw
          - architecture: win64
            os: windows-latest
            shell: msys2
            msystem: UCRT64
            package: asl-windows-x86_64
            p7zip: "/c/Program Files/7-Zip/7z.exe"
            exe_ext: ".exe"
            as: asw
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }} {0}
    steps:
      - name: Install dependencies (Linux)
        if: ${{ startsWith(matrix.architecture, 'linux') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-all-dev ninja-build ${{ matrix.depends }}
      - name: Install dependencies (Mac OS)
        if: ${{ startsWith(matrix.architecture, 'macos') }}
        run: |
          brew install cmake ninja
      - name: Install dependencies (Windows)
        if: ${{ startsWith(matrix.architecture, 'win') }}
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          install: >-
            base-devel git
          pacboy: >-
            toolchain:p binutils:p cmake:p ninja:p
      - name: Install Pandoc
        uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: "3.1.11"
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          cmake -S . -B build -G Ninja "-DCMAKE_C_FLAGS=${{ matrix.cflags }}"
      - name: Build
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          cmake --build build -j
      - name: Test
        run: |
          ctest --test-dir build --parallel --output-on-failure --no-tests=error --timeout 120
      - name: Create package
        run: |
          cp COPYING build/
          cd build
          "${{ matrix.p7zip }}" -tzip a ../${{ matrix.package }}-${{ needs.activity-check.outputs.build_id }}.zip -mx9 -mmt COPYING asl.html asl.odt *.msg {alink,dasl,p2bin,p2hex,pbind,plist}${{ matrix.exe_ext }} ${{ matrix.as }}${{ matrix.exe_ext }}
      - name: Upload snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.activity-check.outputs.tag_name }}" \
            "${{ matrix.package }}-${{ needs.activity-check.outputs.build_id }}.zip" --clobber

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-${{ github.job }}-${{ strategy.job-index }}
          path: |
            build/Testing/Temporary/
            build/CMakeFiles/CMakeConfigureLog.yaml
            build-host/CMakeFiles/CMakeConfigureLog.yaml
          retention-days: 7
          if-no-files-found: ignore

  snapshot-freebsd:
    timeout-minutes: 60
    needs:
      - activity-check
    if: ${{ github.repository_owner == 'flamewing' && needs.activity-check.outputs.REPO_ALIVE == 'true' }}
    runs-on: ubuntu-latest
    env:
      PACKAGE: asl-freebsd-x86_64-${{ needs.activity-check.outputs.build_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build and test in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          sync: rsync
          copyback: true
          prepare: |
            pkg update
            pkg install -y cmake ninja hs-pandoc
          run: |
            export VERBOSE=1
            cmake -S . -B build -G Ninja
            cmake --build build -j
            ctest --test-dir build --parallel --output-on-failure --no-tests=error --timeout 120
      - name: Create package
        run: |
          cp COPYING build/
          cd build
          7z -tzip a ../${PACKAGE}.zip -mx9 -mmt COPYING asl.html asl.odt *.msg alink dasl p2bin p2hex pbind plist asl
      - name: Upload snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.activity-check.outputs.tag_name }}" "${PACKAGE}.zip" --clobber

  # Experimental: cross-compiled with the NDK, not run on CI.
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-${{ github.job }}-${{ strategy.job-index }}
          path: |
            build/Testing/Temporary/
            build/CMakeFiles/CMakeConfigureLog.yaml
            build-host/CMakeFiles/CMakeConfigureLog.yaml
          retention-days: 7
          if-no-files-found: ignore

  # Experimental: cross-compiled with the NDK, not run on CI.
  snapshot-android:
    timeout-minutes: 45
    needs:
      - activity-check
    if: ${{ github.repository_owner == 'flamewing' && needs.activity-check.outputs.REPO_ALIVE == 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      PACKAGE: asl-android-aarch64-${{ needs.activity-check.outputs.build_id }}
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
      - name: Install Pandoc
        uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: "3.1.11"
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build host tools
        run: |
          cmake -S . -B build-host
          cmake --build build-host -j --target rescomp
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DIMPORT_EXECUTABLES=build-host/ImportExecutables.cmake
      - name: Build
        run: |
          cmake --build build -j
      - name: Create package
        run: |
          cp COPYING build/
          cd build
          7z -tzip a ../${PACKAGE}.zip -mx9 -mmt COPYING asl.html asl.odt *.msg alink dasl p2bin p2hex pbind plist asl
      - name: Upload snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.activity-check.outputs.tag_name }}" "${PACKAGE}.zip" --clobber

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-${{ github.job }}-${{ strategy.job-index }}
          path: |
            build/Testing/Temporary/
            build/CMakeFiles/CMakeConfigureLog.yaml
            build-host/CMakeFiles/CMakeConfigureLog.yaml
          retention-days: 7
          if-no-files-found: ignore

  finish-release:
    timeout-minutes: 10
    needs:
      - activity-check
      - snapshots
      - snapshot-freebsd
      - snapshot-android
    if: ${{ always() && github.repository_owner == 'flamewing' && needs.activity-check.outputs.REPO_ALIVE == 'true' }}
    runs-on: "ubuntu-latest"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Finish release
        if: needs.snapshots.result == 'success' && needs.snapshot-freebsd.result == 'success'
        run: |
          gh release edit "${{ needs.activity-check.outputs.tag_name }}" --draft=false
      - name: Rollback release
        if: needs.snapshots.result != 'success' || needs.snapshot-freebsd.result != 'success'
        run: |
          gh release delete "${{ needs.activity-check.outputs.tag_name }}" --yes --cleanup-tag
