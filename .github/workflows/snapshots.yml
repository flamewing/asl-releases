name: snapshots

on:
  schedule:
    - cron: "0 01 * * *" # Daily at 01:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  GH_REPO: ${{ github.repository }}
  VERBOSE: "1"
  ANDROID_NDK_VERSION: "30.0.16248370"

jobs:
  activity-check:
    permissions:
      contents: write
      actions: read
    timeout-minutes: 10
    if: ${{ github.repository_owner == 'flamewing' }}
    runs-on: "ubuntu-latest"
    outputs:
      REPO_ALIVE: ${{ steps.activity.outputs.REPO_ALIVE }}
      build_id: ${{ steps.activity.outputs.build_id }}
      tag_name: ${{ steps.activity.outputs.tag_name }}
      release_id: ${{ steps.release.outputs.release_id }}
      published: ${{ steps.release.outputs.published }}
    steps:
      - name: Activity check
        id: activity
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            REPO_ALIVE=true
          else
            # Only successful runs of this workflow and branch count as processed.
            LAST_SUCCESSFUL_SHA=$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/snapshots.yml/runs" \
              -f branch="$GITHUB_REF_NAME" -f status=success -F per_page=1 \
              --jq '.workflow_runs[0].head_sha // ""')
            if [ "$LAST_SUCCESSFUL_SHA" = "$GITHUB_SHA" ]; then
              REPO_ALIVE=false
            else
              REPO_ALIVE=true
            fi
          fi
          build_id=""
          tag_name=""
          if [ "$REPO_ALIVE" = true ]; then
            # Run creation time is stable across retries, including across midnight.
            RUN_CREATED_AT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.created_at')
            build_id="v1.4.2.$(date --utc -d "$RUN_CREATED_AT" +'%Y%m%d')-run${GITHUB_RUN_ID}"
            tag_name="snapshot-${build_id}"
          fi
          {
            echo "REPO_ALIVE=${REPO_ALIVE}"
            echo "build_id=${build_id}"
            echo "tag_name=${tag_name}"
          } >> "$GITHUB_OUTPUT"
      - name: Checkout release tooling
        if: ${{ steps.activity.outputs.REPO_ALIVE == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare release
        id: release
        if: ${{ steps.activity.outputs.REPO_ALIVE == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAPSHOT_TAG: ${{ steps.activity.outputs.tag_name }}
          SNAPSHOT_BUILD_ID: ${{ steps.activity.outputs.build_id }}
        run: python3 .github/scripts/snapshot_release.py prepare

  snapshots:
    timeout-minutes: 60
    needs:
      - activity-check
    if: ${{ github.repository_owner == 'flamewing' && needs.activity-check.outputs.release_id != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: linux32
            os: ubuntu-latest
            shell: bash
            package: asl-ubuntu-i686
            p7zip: 7z
            exe_ext: ""
            as: asl
            depends: "gcc-multilib"
            cflags: "-m32"
          - architecture: linux64
            os: ubuntu-latest
            shell: bash
            package: asl-ubuntu-x86_64
            p7zip: 7z
            exe_ext: ""
            as: asl
          - architecture: linux-aarch64
            os: ubuntu-24.04-arm
            shell: bash
            package: asl-ubuntu-aarch64
            p7zip: 7z
            exe_ext: ""
            as: asl
          - architecture: macos-x86_64
            os: macos-15-intel # last x86_64 runner image
            shell: bash
            package: asl-osx-x86_64
            p7zip: 7z
            exe_ext: ""
            as: asl
          - architecture: macos-arm64
            os: macos-latest # macos-latest is arm64.
            shell: bash
            package: asl-osx-arm64
            p7zip: 7z
            exe_ext: ""
            as: asl
          - architecture: win32
            os: windows-latest
            shell: msys2
            msystem: MINGW32
            package: asl-windows-i686
            p7zip: "/c/Program Files/7-Zip/7z.exe"
            exe_ext: ".exe"
            as: asw
          - architecture: win64
            os: windows-latest
            shell: msys2
            msystem: UCRT64
            package: asl-windows-x86_64
            p7zip: "/c/Program Files/7-Zip/7z.exe"
            exe_ext: ".exe"
            as: asw
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }} {0}
    steps:
      - name: Install dependencies (Linux)
        if: ${{ startsWith(matrix.architecture, 'linux') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ${{ matrix.depends }}
      - name: Install dependencies (Mac OS)
        if: ${{ startsWith(matrix.architecture, 'macos') }}
        run: |
          brew install cmake ninja
      - name: Install dependencies (Windows)
        if: ${{ startsWith(matrix.architecture, 'win') }}
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: ${{ matrix.msystem }}
          install: >-
            base-devel git
          pacboy: >-
            toolchain:p binutils:p cmake:p ninja:p
      - name: Install Pandoc
        uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          pandoc-version: "3.1.11"
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          cmake -S . -B build -G Ninja "-DCMAKE_C_FLAGS=${{ matrix.cflags }}"
      - name: Build
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          cmake --build build -j
      - name: Test
        run: |
          ctest --test-dir build --parallel --output-on-failure --no-tests=error --timeout 120
      - name: Create package
        run: |
          cp COPYING build/
          cd build
          "${{ matrix.p7zip }}" -tzip a ../${{ matrix.package }}-${{ needs.activity-check.outputs.build_id }}.zip -mx9 -mmt COPYING asl.html asl.odt ./*.msg {alink,dasl,p2bin,p2hex,pbind,plist}${{ matrix.exe_ext }} ${{ matrix.as }}${{ matrix.exe_ext }}
      - name: Store snapshot package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-package-${{ matrix.architecture }}
          path: ${{ matrix.package }}-${{ needs.activity-check.outputs.build_id }}.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-logs-${{ github.job }}-${{ strategy.job-index }}
          path: |
            build/Testing/Temporary/
            build/CMakeFiles/CMakeConfigureLog.yaml
            build-host/CMakeFiles/CMakeConfigureLog.yaml
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true

  snapshot-freebsd:
    timeout-minutes: 60
    needs:
      - activity-check
    if: ${{ github.repository_owner == 'flamewing' && needs.activity-check.outputs.release_id != '' }}
    runs-on: ubuntu-latest
    env:
      PACKAGE: asl-freebsd-x86_64-${{ needs.activity-check.outputs.build_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test in FreeBSD
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1
        with:
          usesh: true
          sync: rsync
          copyback: true
          prepare: |
            pkg update
            pkg install -y cmake ninja hs-pandoc
          run: |
            export VERBOSE=1
            cmake -S . -B build -G Ninja
            cmake --build build -j
            ctest --test-dir build --parallel --output-on-failure --no-tests=error --timeout 120
      - name: Create package
        run: |
          cp COPYING build/
          cd build
          7z -tzip a "../${PACKAGE}.zip" -mx9 -mmt COPYING asl.html asl.odt ./*.msg alink dasl p2bin p2hex pbind plist asl
      - name: Store snapshot package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-package-${{ github.job }}
          path: ${{ env.PACKAGE }}.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-logs-${{ github.job }}-${{ strategy.job-index }}
          path: |
            build/Testing/Temporary/
            build/CMakeFiles/CMakeConfigureLog.yaml
            build-host/CMakeFiles/CMakeConfigureLog.yaml
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true

  # Experimental: cross-compiled with the NDK, not run on CI.
  snapshot-android:
    timeout-minutes: 45
    needs:
      - activity-check
    if: ${{ github.repository_owner == 'flamewing' && needs.activity-check.outputs.release_id != '' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      PACKAGE: asl-android-aarch64-${{ needs.activity-check.outputs.build_id }}
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
      - name: Install Pandoc
        uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          pandoc-version: "3.1.11"
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Android NDK
        run: |
          ndk_home="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          if [ ! -d "$ndk_home" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION"
          fi
          echo "ASL_ANDROID_NDK_HOME=$ndk_home" >> "$GITHUB_ENV"
      - name: Build host tools
        run: |
          cmake -S . -B build-host
          cmake --build build-host -j --target rescomp
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ASL_ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DIMPORT_EXECUTABLES=build-host/ImportExecutables.cmake
      - name: Build
        run: |
          cmake --build build -j
      - name: Create package
        run: |
          cp COPYING build/
          cd build
          7z -tzip a "../${PACKAGE}.zip" -mx9 -mmt COPYING asl.html asl.odt ./*.msg alink dasl p2bin p2hex pbind plist asl
      - name: Store snapshot package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-package-${{ github.job }}
          path: ${{ env.PACKAGE }}.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-logs-${{ github.job }}-${{ strategy.job-index }}
          path: |
            build/Testing/Temporary/
            build/CMakeFiles/CMakeConfigureLog.yaml
            build-host/CMakeFiles/CMakeConfigureLog.yaml
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true

  finish-release:
    permissions:
      contents: write
    timeout-minutes: 10
    needs:
      - activity-check
      - snapshots
      - snapshot-freebsd
      - snapshot-android
    if: ${{ always() && !cancelled() && github.repository_owner == 'flamewing' && needs.activity-check.outputs.release_id != '' }}
    runs-on: "ubuntu-latest"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SNAPSHOT_TAG: ${{ needs.activity-check.outputs.tag_name }}
      SNAPSHOT_BUILD_ID: ${{ needs.activity-check.outputs.build_id }}
      ORIGINAL_RELEASE_ID: ${{ needs.activity-check.outputs.release_id }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Recover or validate release
        id: release
        if: needs.snapshots.result == 'success' && needs.snapshot-freebsd.result == 'success'
        run: python3 .github/scripts/snapshot_release.py prepare --release-id "$ORIGINAL_RELEASE_ID"
      - name: Download snapshot packages
        if: steps.release.outputs.release_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: snapshot-package-*
          merge-multiple: true
          path: release-assets
      - name: Upload snapshot assets
        if: steps.release.outputs.release_id != ''
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: python3 .github/scripts/snapshot_release.py upload --release-id "$RELEASE_ID"
      - name: Publish snapshot
        if: steps.release.outputs.release_id != ''
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: python3 .github/scripts/snapshot_release.py publish --release-id "$RELEASE_ID"
      - name: Clean up owned draft after failure
        if: ${{ !cancelled() && (failure() || needs.snapshots.result != 'success' || needs.snapshot-freebsd.result != 'success') }}
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id || needs.activity-check.outputs.release_id }}
        run: python3 .github/scripts/snapshot_release.py cleanup --release-id "$RELEASE_ID"
