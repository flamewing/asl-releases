name: coverity-scan

on:
  schedule:
    - cron: "0 00 * * *" # Daily at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SHA1: ${{ github.sha }}
  FILE: asl-releases-ubuntu-gcc.tgz
  PROJ: flamewing%2Fasl-releases

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverity-linux:
    timeout-minutes: 60
    if: ${{ github.repository_owner == 'flamewing' }}
    runs-on: ubuntu-latest
    steps:
      - name: Activity check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            REPO_ALIVE=true
          else
            # Only successful runs of this workflow and branch count as processed.
            LAST_SUCCESSFUL_SHA=$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/coverity-scan.yml/runs" \
              -f branch="$GITHUB_REF_NAME" -f status=success -F per_page=1 \
              --jq '.workflow_runs[0].head_sha // ""')
            if [ "$LAST_SUCCESSFUL_SHA" = "$GITHUB_SHA" ]; then
              REPO_ALIVE=false
            else
              REPO_ALIVE=true
            fi
          fi
          echo "REPO_ALIVE=$REPO_ALIVE" >> "$GITHUB_ENV"
      - name: Install dependencies
        if: ${{ env.REPO_ALIVE == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake
      - name: Download Coverity Build Tool
        env:
          TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}
        if: ${{ env.REPO_ALIVE == 'true' }}
        run: |
          wget -q https://scan.coverity.com/download/Linux --post-data "token=$TOKEN&project=$PROJ" -O /tmp/cov-analysis-linux64.tar.gz
          mkdir /tmp/cov-analysis-linux64
          tar xzf /tmp/cov-analysis-linux64.tar.gz --strip 1 -C /tmp/cov-analysis-linux64
      - name: Checkout code
        if: ${{ env.REPO_ALIVE == 'true' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure
        if: ${{ env.REPO_ALIVE == 'true' }}
        run: |
          cmake -S . -B build -G "Unix Makefiles"
      - name: Build with cov-build
        if: ${{ env.REPO_ALIVE == 'true' }}
        run: |
          export PATH=/tmp/cov-analysis-linux64/bin:$PATH
          cov-build --dir cov-int cmake --build build --parallel
      - name: Submit the result to Coverity Scan
        env:
          TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}
          EMAIL: ${{ secrets.COVERITY_SCAN_EMAIL }}
        if: ${{ env.REPO_ALIVE == 'true' }}
        run: |
          tar czvf $FILE cov-int
          curl \
            --form project=$PROJ \
            --form token=$TOKEN \
            --form email=$EMAIL \
            --form file=@$FILE \
            --form version=master \
            --form description="$SHA1" \
            https://scan.coverity.com/builds?project=$PROJ
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: failure-logs-coverity
          path: |
            build/CMakeFiles/CMakeConfigureLog.yaml
            cov-int/build-log.txt
          retention-days: 7
          if-no-files-found: ignore
