name: ci-windows-msvc

on:
  push:
    paths:
      - '**'
      - '!*.bat'
      - '!*.cmd'
      - '!*.sh'
      - '!doc_COM/*'
      - '!doc_DE/*'
      - '!doc_EN/*'
      - '!man/*'
      - '!COPYING'
      - '!INSTALL'
      - '!README*'
      - '!.clang*'
      - '!.gitignore'
      - '!.gitattributes'
      - '!.github/workflows/*'
      - '.github/workflows/ci-windows-msvc.yml'
  pull_request:
    paths:
      - '**'
      - '!*.bat'
      - '!*.cmd'
      - '!*.sh'
      - '!doc_COM/*'
      - '!doc_DE/*'
      - '!doc_EN/*'
      - '!man/*'
      - '!COPYING'
      - '!INSTALL'
      - '!README*'
      - '!.clang*'
      - '!.gitignore'
      - '!.gitattributes'
      - '!.github/workflows/*'
      - '.github/workflows/ci-windows-msvc.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERBOSE: "1"

jobs:
  ci-windows-msvc:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vs2022
            runs_on: windows-2022
            cmake_generator: Visual Studio 17 2022
          - name: latest
            runs_on: windows-latest
            cmake_generator: ''
    name: ci-windows-msvc (${{ matrix.name }})
    runs-on: ${{ matrix.runs_on }}
    steps:
      - name: Install Pandoc
        uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          pandoc-version: '3.1.11'
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
      - name: Select Visual Studio generator
        shell: pwsh
        run: |
          $generator = '${{ matrix.cmake_generator }}'

          if (-not $generator) {
            $capabilities = cmake -E capabilities | ConvertFrom-Json
            $generator = $capabilities.generators |
              Where-Object { $_.name -match '^Visual Studio \d+ \d{4}$' } |
              Sort-Object { [int]([regex]::Match($_.name, '^Visual Studio (\d+)').Groups[1].Value) } -Descending |
              Select-Object -ExpandProperty name -First 1
          }

          if (-not $generator) {
            throw 'No Visual Studio generator found in CMake capabilities.'
          }

          "CMAKE_GENERATOR=$generator" >> $env:GITHUB_ENV
          Write-Host "Selected CMake generator: $generator"
      - name: Configure
        run: |
          cmake -S . -B build -A x64 -G "$env:CMAKE_GENERATOR"
      - name: Build
        run: |
          cmake --build build --config Debug --parallel
      - name: Test
        run: |
          ctest --test-dir build --parallel --output-on-failure --no-tests=error --timeout 120 -C Debug
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: failure-logs-${{ github.job }}-${{ strategy.job-index }}
          path: |
            build/Testing/Temporary/
            build/CMakeFiles/CMakeConfigureLog.yaml
            build-host/CMakeFiles/CMakeConfigureLog.yaml
          retention-days: 7
          if-no-files-found: ignore
